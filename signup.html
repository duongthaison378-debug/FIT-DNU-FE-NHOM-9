<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        FitTrack - Đăng Nhập / Đăng Ký
    </title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            font-family: "Inter", sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;

        }

        .container {

            width: 90%;
            max-width: 1200px;
            margin: auto;

        }

        .auth-section {

            padding: 80px 0;

        }

        .auth-wrapper {

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            align-items: center;

        }

        .auth-image img {

            width: 100%;
            border-radius: 25px;
            height: 700px;
            object-fit: cover;

        }

        .auth-box {

            background: #1e293b;
            padding: 40px;
            border-radius: 25px;

        }

        .auth-box h1 {

            font-size: 45px;
            margin-bottom: 15px;
            color: #22c55e;

        }

        .auth-box p {

            color: #cbd5e1;
            margin-bottom: 30px;

        }

        .tab-buttons {

            display: flex;
            gap: 15px;
            margin-bottom: 30px;

        }

        .tab-btn {

            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #334155;
            color: white;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;

        }

        .tab-btn.active {

            background: #22c55e;

        }

        .form-box {

            display: none;

        }

        .form-box.active {

            display: block;

        }

        .form-box input {

            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 15px;

        }

        .form-box input:focus {

            outline: 2px solid #22c55e;

        }

        .btn {

            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;

        }

        .btn:hover {

            background: #16a34a;

        }

        .alert {

            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;

        }

        .success {

            background: #16a34a;

        }

        .error {

            background: #dc2626;

        }

        .info-box {

            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #0f172a;

        }

        .info-box h3 {

            margin-bottom: 10px;
            color: #22c55e;

        }

        .info-box p {

            margin-bottom: 8px;
            color: #cbd5e1;

        }

        @media(max-width:900px) {

            .auth-wrapper {

                grid-template-columns: 1fr;

            }

            .auth-image img {

                height: 400px;

            }

        }
    </style>

</head>

<body>

    <section class="auth-section">

        <div class="container auth-wrapper">

            <!-- IMAGE -->

            <div class="auth-image">

                <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=1200&auto=format&fit=crop"
                    alt="Fitness">

            </div>

            <!-- FORM -->

            <div class="auth-box">

                <h1>

                    FitTrack

                </h1>

                <p>

                    Hệ thống quản lý Fitness hiện đại

                </p>

                <!-- ALERT -->

                <div class="alert success" id="successAlert">

                </div>

                <div class="alert error" id="errorAlert">

                </div>

                <!-- TAB -->

                <div class="tab-buttons">

                    <button class="tab-btn active" id="loginTab">

                        Đăng nhập

                    </button>

                    <button class="tab-btn" id="registerTab">

                        Đăng ký

                    </button>

                </div>

                <!-- LOGIN -->

                <form class="form-box active" id="loginForm">

                    <input type="email" id="loginEmail" placeholder="Email">

                    <input type="password" id="loginPassword" placeholder="Mật khẩu">

                    <button type="submit" class="btn">

                        Đăng nhập

                    </button>

                </form>

                <!-- REGISTER -->

                <form class="form-box" id="registerForm">

                    <input type="text" id="registerName" placeholder="Họ tên">

                    <input type="email" id="registerEmail" placeholder="Email">

                    <input type="password" id="registerPassword" placeholder="Mật khẩu">

                    <button type="submit" class="btn">

                        Đăng ký

                    </button>

                </form>

                <!-- INFO -->

                <div class="info-box">

                    <h3>

                        🔐 Phân quyền hệ thống

                    </h3>

                    <p>

                        👤 User:
                        Xem workout,
                        lịch tập,
                        dinh dưỡng.

                    </p>

                    <p>

                        🏋️ Trainer:
                        Quản lý học viên,
                        workout,
                        lịch tập.

                    </p>

                    <p>

                        👑 Admin:
                        Toàn quyền hệ thống.

                    </p>

                </div>

            </div>

        </div>

    </section>

    <script>

        // =========================
        // ELEMENT
        // =========================

        const loginTab =
            document.getElementById(
                "loginTab"
            );

        const registerTab =
            document.getElementById(
                "registerTab"
            );

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const successAlert =
            document.getElementById(
                "successAlert"
            );

        const errorAlert =
            document.getElementById(
                "errorAlert"
            );

        // =========================
        // TAB
        // =========================

        loginTab.onclick = () => {

            loginTab.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

            loginForm.classList.add(
                "active"
            );

            registerForm.classList.remove(
                "active"
            );

        };

        registerTab.onclick = () => {

            registerTab.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerForm.classList.add(
                "active"
            );

            loginForm.classList.remove(
                "active"
            );

        };

        // =========================
        // ALERT
        // =========================

        function showSuccess(message) {

            successAlert.style.display =
                "block";

            successAlert.innerText =
                message;

            errorAlert.style.display =
                "none";

        }

        function showError(message) {

            errorAlert.style.display =
                "block";

            errorAlert.innerText =
                message;

            successAlert.style.display =
                "none";

        }

        // =========================
        // DEFAULT ADMIN
        // =========================

        let users =
            JSON.parse(
                localStorage.getItem(
                    "fittrackUsers"
                )
            ) || [];

        const adminExists =
            users.find(
                user =>
                    user.role === "admin"
            );

        if (!adminExists) {

            users.push({

                name: "Admin",

                email: "admin@gmail.com",

                password: "1234567890",

                role: "admin"

            });

            localStorage.setItem(

                "fittrackUsers",

                JSON.stringify(users)

            );

        }

        // =========================
        // REGISTER
        // =========================

        registerForm.addEventListener(
            "submit",
            (e) => {

                e.preventDefault();

                const name =
                    document.getElementById(
                        "registerName"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "registerEmail"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "registerPassword"
                    ).value.trim();

                if (
                    !name ||
                    !email ||
                    !password
                ) {

                    showError(
                        "Vui lòng nhập đầy đủ"
                    );

                    return;

                }

                let users =
                    JSON.parse(
                        localStorage.getItem(
                            "fittrackUsers"
                        )
                    ) || [];

                const checkUser =
                    users.find(
                        user =>
                            user.email === email
                    );

                if (checkUser) {

                    showError(
                        "Email đã tồn tại"
                    );

                    return;

                }

                const newUser = {

                    name,
                    email,
                    password,

                    // MẶC ĐỊNH USER

                    role: "user"

                };

                users.push(newUser);

                localStorage.setItem(

                    "fittrackUsers",

                    JSON.stringify(users)

                );

                showSuccess(
                    "Đăng ký thành công"
                );

                registerForm.reset();

            }
        );

        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener(
            "submit",
            (e) => {

                e.preventDefault();

                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value.trim();

                let users =
                    JSON.parse(
                        localStorage.getItem(
                            "fittrackUsers"
                        )
                    ) || [];

                const user =
                    users.find(

                        u =>

                            u.email === email &&
                            u.password === password

                    );

                if (!user) {

                    showError(
                        "Sai email hoặc mật khẩu"
                    );

                    return;

                }

                localStorage.setItem(

                    "fittrackCurrentUser",

                    JSON.stringify(user)

                );

                showSuccess(
                    "Đăng nhập thành công"
                );

                // =========================
                // PHÂN QUYỀN
                // =========================

                setTimeout(() => {

                    // ADMIN

                    if (
                        user.role === "admin"
                    ) {

                        window.location.href =
                            "admin.html";

                    }

                    // TRAINER

                    else if (
                        user.role === "trainer"
                    ) {

                        window.location.href =
                            "trainer.html";

                    }

                    // USER

                    else {

                        window.location.href =
                            "index.html";

                    }

                }, 1000);

            }
        );

    </script>

    <script src="main.js"> </script>
    
    <script src="api.js"></script>

</body>

</html>
